[global]
iocore=4,5,6,7
zlog_config_path=../etc/dp_trace_zlog.conf
dp_trace_dir=./
device_group=
monit_file_path=/var/run/mrzcpd/mrmonit.app.dp_trace_telemetry.saving

[kafka]
borker_list="192.168.44.12"
topic_name="datapath-telemetry-record-test"
sasl_username=
sasl_password=

[maat]
# 0:json 1:redis
maat_log_level=0
maat_input_mode=0
table_schema=../etc/table_schema.json
json_cfg_file=../etc/dp_telemetry_rules.json
maat_redis_server=
maat_redis_port_range=
maat_redis_db_index=
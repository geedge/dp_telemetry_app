[global]
iocore=4,5,6,7
zlog_config_path=../etc/dp_trace_zlog.conf
dp_trace_dir=./
device_group="device-xxx"
data_center="center-nyj-one"
monit_file_path=/var/run/mrzcpd/mrmonit.app.dp_trace_telemetry.saving

[http_server]
listen_addr=127.0.0.1
listen_port=10000
keep_alive_path=/probe

[kafka]
broker_list="192.168.44.12:9094"
topic_name="DATAPATH-TELEMETRY-RECORD"
sasl_username=admin
sasl_password=galaxy2019
queue_size=100000

[maat]
maat_log_level=3
# 0:json 1:redis
maat_input_mode=1
deferred_load_on=0
table_schema=../etc/table_schema.json
json_cfg_file=../etc/dp_telemetry_rules.json
maat_redis_server=192.168.44.3
maat_redis_port_range=7002
maat_redis_db_index=1

[debug]
send_ctrlbuf=0
send_invalid_traffic_link_id=0
kafka_dump_to_log=0
arp_pkt_has_ip_test=0